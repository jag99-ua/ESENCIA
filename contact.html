<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000"><meta name="robots" content="noindex, follow">
  <title>Contacto — ESENCIA EVENTS</title>
  <meta name="description" content="Contacta con ESENCIA. Música, artistas y colaboraciones.">
  <link rel="icon" type="image/jpeg" href="assets/logos/978d7eee-0ed3-4bf8-a2be-967ae82970fa.jpg">
  <link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/commerce.css">
  <link rel="stylesheet" href="css/art-direction.css">
  <script defer src="js/contact-form.js"></script>
<script defer src="js/icons.js"></script></head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="header"><a class="home-link" href="index.html" aria-label="Volver a ESENCIA"><img src="assets/logos/54556e34-e6f0-4224-a22b-40b828f6fcf9.png" alt="ESENCIA" width="2048" height="184"></a><a class="meta" href="index.html#contacto">Volver</a></header>
  <main id="contenido" class="section simple-contact">
    <div class="section-label meta"><span>ESENCIA / Contacto</span></div>
    <h1 class="display page-heading">Hablemos.</h1>
    <form class="message-form" data-contact-form>
      <label class="field">Nombre<input name="name" autocomplete="name" required maxlength="100"></label>
      <label class="field">Email<input name="email" type="email" autocomplete="email" required maxlength="200"></label>
      <label class="field full-field">Sobre qué quieres hablar<select name="topic" required><option value="">Elige un tema</option><option>General</option><option>Artistas / Bookings</option><option>Colaboraciones</option><option>Prensa</option><option>Merchandising</option></select></label>
      <label class="field full-field">Mensaje<textarea name="message" rows="6" required minlength="10" maxlength="3000"></textarea></label>
      <label class="contact-trap" aria-hidden="true">Deja este campo vacío<input name="website" autocomplete="off" tabindex="-1"></label>
      <button class="primary-button full-field" type="submit">Enviar mensaje</button>
    </form>
    <p class="form-status" data-form-status role="status" aria-live="polite"></p>
    <p class="form-note">Usaremos tus datos para responderte. <a href="privacy.html">Privacidad</a>.</p>
    <noscript><p>Activa JavaScript para enviar el formulario o usa los <a href="index.html#contacto">enlaces de contacto</a>.</p></noscript>
  </main>
</body>
</html>
